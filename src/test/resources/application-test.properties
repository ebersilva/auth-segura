# Perfil de pruebas. El secreto JWT es aleatorio en cada contexto: nunca hay un secreto versionado.
# Cada contexto de Spring usa su propia base H2: con un nombre compartido, el create-drop de un contexto
# que se cierra borraba las tablas de los demás (pruebas dependientes del orden de ejecución).
spring.datasource.url=jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1
auth.jwt.secret=${random.value}${random.value}
# Capacidad alta para que las pruebas funcionales no choquen con el limitador;
# las pruebas de fuerza bruta usan su propio contexto con limites bajos.
auth.rate-limit.ip-capacity=10000
auth.rate-limit.login-capacity=50
logging.level.com.equipo.auth=WARN
