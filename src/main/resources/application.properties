spring.application.name=auth-segura
server.port=8081

# Errores: nunca exponer stack traces ni mensajes internos (A05)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Base de datos en memoria (desarrollo). En produccion: PostgreSQL con credenciales por entorno.
spring.datasource.url=jdbc:h2:mem:auth;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Rechazar propiedades JSON desconocidas (evita mass assignment, p. ej. "role":"ADMIN")
spring.jackson.deserialization.fail-on-unknown-properties=true

# JWT: el secreto es OBLIGATORIO y llega por la variable de entorno JWT_SECRET
# (Base64, minimo 256 bits). Sin el, la aplicacion no arranca.
auth.jwt.secret=${JWT_SECRET:}
auth.jwt.issuer=https://auth-segura.local
auth.jwt.audience=auth-segura-api
auth.jwt.access-token-ttl=15m
auth.jwt.refresh-token-ttl=7d

# Rate limiting (token bucket)
auth.rate-limit.ip-capacity=20
auth.rate-limit.ip-refill-period=1m
auth.rate-limit.login-capacity=5
auth.rate-limit.login-refill-period=1m

# Bloqueo de cuenta tras intentos fallidos
auth.lockout.max-failed-attempts=5
auth.lockout.duration=15m

# HTTP
auth.http.cors-allowed-origins=http://localhost:5173
auth.http.max-body-bytes=4096
